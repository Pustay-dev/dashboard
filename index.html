<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171714">
<title>Daily Check-In</title>
<style>
:root{
  --bg:#171714;
  --panel:#22221e;
  --panel2:#2a2a25;
  --text:#f0eee6;
  --muted:#a5a39a;
  --line:rgba(240,238,230,.12);
  --accent:#d6c29a;
  --red:#c9574f;
  --yellow:#d5a93e;
  --green:#70a46d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:620px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(70px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
h1,h2,h3,p{margin:0}
h1{font:600 25px Georgia,serif;letter-spacing:-.4px}
.date{font-size:12px;color:var(--muted);margin-top:4px}
.gear{border:1px solid var(--line);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:12px;font-size:20px}
.sync{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.good{background:var(--green)}
.dot.bad{background:var(--red)}
.sync button{border:0;background:none;color:var(--accent);font-size:11px;padding:0;text-decoration:underline}

.global{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:22px}
.global-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}
.global-label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.global-pct{font:600 38px Georgia,serif;line-height:1}
.bar{height:15px;background:var(--bg);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;border-radius:20px;transition:width .25s ease,background .25s ease}
.global-foot{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:12px}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-head h2{font:600 17px Georgia,serif}
.small{font-size:11px;color:var(--muted)}

.activity{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px}
.activity-head{display:flex;justify-content:space-between;gap:12px}
.name{font-size:16px;font-weight:650}
.target{font-size:12px;color:var(--muted);margin-top:2px}
.pct{font:600 20px Georgia,serif;white-space:nowrap}
.activity .bar{height:10px;margin:13px 0 5px}
.activity-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:12px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.actions button{min-height:42px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;font-weight:650;font-size:13px}
.actions button:active{background:var(--accent);color:var(--bg)}
.actions .minus{color:var(--muted)}
.lockbadge{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;vertical-align:middle;margin-left:4px}

.empty{border:1px dashed var(--line);border-radius:14px;padding:25px;text-align:center;color:var(--muted);font-size:13px}

.todo-add{display:flex;gap:8px}
.todo-add input{flex:1;margin:0}
.todo-add button{background:var(--accent);color:var(--bg);border:0;border-radius:9px;padding:0 16px;font-weight:700}
.todo-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.todo-row:last-child{border-bottom:0}
.todo-row label{display:flex;align-items:center;gap:10px;flex:1;font-size:13px}
.todo-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.todo-row.done span{text-decoration:line-through;color:var(--muted)}
.todo-del{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 6px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:22px 18px calc(28px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sheet h2{font:600 21px Georgia,serif}
.close{background:none;border:0;color:var(--muted);font-size:26px}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 12px;outline:none}
input:focus{border-color:var(--accent)}
.primary{width:100%;margin-top:15px;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:12px;font-weight:700}
.secondary{width:100%;margin-top:8px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:600}
.divider{border-top:1px solid var(--line);margin:22px 0}
.activity-setting{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.activity-setting .info{flex:1}
.activity-setting strong{font-size:13px}
.activity-setting span{display:block;color:var(--muted);font-size:11px}
.delete{background:none;border:0;color:var(--red);font-size:12px}
.notice{font-size:11px;line-height:1.5;color:var(--muted);background:var(--panel2);padding:11px;border-radius:9px;margin-top:12px}
.status-msg{font-size:12px;margin-top:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Daily Check-In</h1>
      <div class="date" id="date"></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">local only</span><button id="syncBtn">sync now</button></div>
    </div>
    <button class="gear" id="settingsBtn" aria-label="Settings">⚙︎</button>
  </header>

  <section class="global">
    <div class="global-top">
      <div class="global-label">Overall progress</div>
      <div class="global-pct" id="globalPct">0%</div>
    </div>
    <div class="bar"><div class="fill" id="globalFill"></div></div>
    <div class="global-foot"><span id="globalMinutes">0 / 0 min</span><span id="globalState">Start.</span></div>
  </section>

  <div class="section-head">
    <h2>Activities</h2>
    <span class="small" id="activityCount"></span>
  </div>
  <main id="activities"></main>

  <section class="global" style="margin-top:22px">
    <div class="section-head" style="margin-bottom:6px"><h2>Recent days</h2><span class="small">saved locally + cloud</span></div>
    <div id="history"></div>
  </section>

  <section class="global" style="margin-top:22px">
    <div class="section-head" style="margin-bottom:10px"><h2>To-do</h2></div>
    <div class="todo-add">
      <input id="todoInput" placeholder="Add a quick task…">
      <button id="todoAddBtn">Add</button>
    </div>
    <div id="todoList" style="margin-top:12px"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head"><h2>Settings</h2><button class="close" id="closeSettings">×</button></div>

    <h3 style="font:600 16px Georgia,serif">Activities</h3>
    <div id="settingsActivities"></div>

    <div class="divider"></div>
    <h3 style="font:600 16px Georgia,serif">Add activity</h3>
    <label for="newName">Activity name</label>
    <input id="newName" placeholder="e.g. Painting">
    <label for="newTarget">Target (total minutes)</label>
    <input id="newTarget" type="number" min="1" step="1" placeholder="120">
    <button class="primary" id="addActivity">Add activity</button>

    <div class="divider"></div>
    <h3 style="font:600 16px Georgia,serif">Plan tomorrow</h3>
    <div class="small">Queued here now — appears in your list the moment midnight passes, and can't be deleted after that.</div>
    <label for="pendingName">Activity name</label>
    <input id="pendingName" placeholder="e.g. Cardio">
    <label for="pendingTarget">Target (total minutes)</label>
    <input id="pendingTarget" type="number" min="1" step="1" placeholder="30">
    <button class="primary" id="addPending">Queue for tomorrow</button>
    <div id="pendingList" style="margin-top:10px"></div>

    <div class="divider"></div>
    <h3 style="font:600 16px Georgia,serif">Cloud sync</h3>
    <div class="small" id="settingsSyncInfo"></div>
  </div>
</div>

<script>
/*
  DAILY CHECK-IN
  ----------------
  Activities are now persistent goals, not daily-resetting habits:
  progress accumulates on the activity itself (a.progress) and is
  never zeroed out overnight. At midnight:
    - anything that reached 100% is archived (cleared from view)
    - anything still incomplete carries its exact progress forward
    - anything queued in "Plan tomorrow" gets promoted into the
      active list, permanently locked (can't be deleted)
  A day's overall % is frozen into state.history once, at the moment
  it ends, and never recalculated afterward.

  Cloud sync points at one fixed JSONBin.io bin, shared by every
  device that loads this file — no per-device setup, no sync links.
  NOTE: the key below is embedded in this file and visible to anyone
  who views source. Fine for a private, personal-use bin — don't use
  this pattern anywhere you don't want writable by whoever gets a
  copy of this HTML.
*/
const BIN_ID = "6a9b3c7dda38895dfe3a22ef";
const API_KEY = "$2a$10$hlqfMzR5Oh/4/9sT94qsn.9nKQ.nyIYDwhpAXEDkOuFVmjKz.JDtm";
const JSONBIN_API = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const LOCAL = "daily_checkin_v1";

let state = null;
let cloudOk = false;
let saveTimer = null;

function today(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addDays(dateStr,n){
  const dt=new Date(dateStr+"T12:00:00");
  dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function defaultState(){
  return {
    activities:[
      {id:uid(),name:"Painting",target:120,progress:0,archived:false,locked:false},
      {id:uid(),name:"Workout",target:60,progress:0,archived:false,locked:false},
      {id:uid(),name:"Reading",target:45,progress:0,archived:false,locked:false}
    ],
    pending:[],
    history:{},   // date -> frozen final overall % for that day, set once, never recalculated
    lastDate: today(),
    todos:[]
  };
}
function activeActivities(){
  return state.activities.filter(a=>!a.archived);
}

/* One-time migration for records saved before this version (old
   per-day "days" object). Keeps whatever the current day's numbers
   were as the starting "progress" for each activity. Safe to run
   every load — it's a no-op once already migrated. */
function migrateState(){
  if(state.days && typeof state.days==="object"){
    const keys=Object.keys(state.days);
    const src=keys.length?state.days[keys[keys.length-1]]:{};
    state.activities.forEach(a=>{
      if(typeof a.progress!=="number") a.progress=Number(src[a.id])||0;
      if(typeof a.archived!=="boolean") a.archived=false;
      if(typeof a.locked!=="boolean") a.locked=false;
    });
    delete state.days;
  } else {
    state.activities.forEach(a=>{
      if(typeof a.progress!=="number") a.progress=0;
      if(typeof a.archived!=="boolean") a.archived=false;
      if(typeof a.locked!=="boolean") a.locked=false;
    });
  }
  if(!Array.isArray(state.pending)) state.pending=[];
  if(!state.history) state.history={};
  if(!state.lastDate) state.lastDate=today();
  if(!Array.isArray(state.todos)) state.todos=[];
}

function promotePending(d){
  if(!Array.isArray(state.pending) || !state.pending.length) return;
  const stillPending=[];
  state.pending.forEach(item=>{
    if(d>item.queuedOn){
      state.activities.push({id:item.id,name:item.name,target:item.target,progress:0,archived:false,locked:true});
    } else {
      stillPending.push(item);
    }
  });
  state.pending=stillPending;
}

/* Runs on every load/render. Does nothing on repeat calls within the
   same day. When the date has actually changed since last checked:
   freezes yesterday's (and any fully-skipped days') overall % into
   history, archives anything that hit 100%, leaves incomplete
   activities exactly as they are, and promotes queued items. */
function checkMidnight(){
  const d=today();
  if(state.lastDate===d){
    activeActivities().forEach(a=>{ if(typeof a.progress!=="number") a.progress=0; });
    return;
  }
  if(state.lastDate){
    const p=Math.round(globalPct());
    if(typeof state.history[state.lastDate]!=="number") state.history[state.lastDate]=p;
    // Fully-skipped days (app not opened): nothing changed on them,
    // so carry the same frozen % forward flat rather than dropping
    // to 0 — progress no longer resets daily, so 0 would be false.
    let cursor=addDays(state.lastDate,1);
    while(cursor<d){
      if(typeof state.history[cursor]!=="number") state.history[cursor]=p;
      cursor=addDays(cursor,1);
    }
    state.activities.forEach(a=>{
      if(!a.archived && Number(a.target)>0 && Number(a.progress)>=Number(a.target)) a.archived=true;
    });
    promotePending(d);
  }
  state.lastDate=d;
  activeActivities().forEach(a=>{ if(typeof a.progress!=="number") a.progress=0; });
}

function saveLocal(){
  localStorage.setItem(LOCAL,JSON.stringify(state));
}
function loadLocal(){
  try{ state=JSON.parse(localStorage.getItem(LOCAL)||"null"); }catch(e){state=null}
  if(!state || !Array.isArray(state.activities)) state=defaultState();
  migrateState();
  checkMidnight(); saveLocal();
}
function mins(){
  return activeActivities().reduce((sum,a)=>sum+(Number(a.progress)||0),0);
}
function targetTotal(){
  return activeActivities().reduce((sum,a)=>sum+Number(a.target||0),0);
}
function pctFor(a){
  return Math.max(0,Math.min(100,(Number(a.progress)||0)/Number(a.target||1)*100));
}
function globalPct(){
  const t=targetTotal();
  return t?Math.max(0,Math.min(100,(mins()/t)*100)):0;
}
function colorFor(p){
  if(p<10) return "var(--red)";
  if(p<90) return "var(--yellow)";
  return "var(--green)";
}
function formatM(m){
  m=Math.round(m);
  if(m>=60){
    const h=Math.floor(m/60), r=m%60;
    return r ? h+"h "+r+"m" : h+"h";
  }
  return m+"m";
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function render(){
  checkMidnight();
  const d=new Date();
  document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const gp=globalPct();
  const gf=document.getElementById("globalFill");
  gf.style.width=gp+"%"; gf.style.background=colorFor(gp);
  document.getElementById("globalPct").textContent=Math.round(gp)+"%";
  document.getElementById("globalPct").style.color=colorFor(gp);
  document.getElementById("globalMinutes").textContent=formatM(mins())+" / "+formatM(targetTotal());
  document.getElementById("globalState").textContent=gp<10?"Start.":gp<90?"Keep going.":gp<100?"Almost there.":"Complete.";
  document.getElementById("activityCount").textContent=activeActivities().length+" activities";

  const root=document.getElementById("activities");
  root.innerHTML="";
  const acts=activeActivities();
  if(!acts.length){
    root.innerHTML='<div class="empty">No activities yet.<br>Open ⚙︎ to add your first one.</div>';
  }
  acts.forEach(a=>{
    const p=pctFor(a), value=Number(a.progress)||0;
    const el=document.createElement("article");
    el.className="activity";
    el.innerHTML=`
      <div class="activity-head">
        <div><div class="name">${esc(a.name)}${a.locked?' <span class="lockbadge">locked</span>':''}</div><div class="target">${formatM(a.target)} goal</div></div>
        <div class="pct" style="color:${colorFor(p)}">${Math.round(p)}%</div>
      </div>
      <div class="bar"><div class="fill" style="width:${p}%;background:${colorFor(p)}"></div></div>
      <div class="activity-foot"><span>${formatM(value)} done</span><span>${Math.max(0,Math.ceil(a.target-value))>0?formatM(Math.max(0,a.target-value))+" left":"done"}</span></div>
      <div class="actions">
        <button class="minus" data-d="-15">−15m</button>
        <button data-d="15">+15m</button>
        <button data-d="30">+30m</button>
        <button data-d="60">+1h</button>
      </div>`;
    el.querySelectorAll("button").forEach(b=>b.onclick=()=>adjust(a.id,Number(b.dataset.d)));
    root.appendChild(el);
  });
  renderHistory();
  renderTodos();
}
function adjust(id,delta){
  const a=state.activities.find(x=>x.id===id);
  if(!a) return;
  a.progress=Math.max(0,(Number(a.progress)||0)+delta);
  saveLocal(); render(); scheduleCloudSave();
}

function renderHistory(){
  const box=document.getElementById("history");
  const dates=Object.keys(state.history).sort();
  if(!dates.length){box.innerHTML='<div class="small">Your previous days will appear here.</div>';return;}

  const padL=30,padR=14,padTop=16,padBottom=24,h=160,w=600;
  const plotW=w-padL-padR, plotH=h-padTop-padBottom;
  const stepX=dates.length>1?plotW/(dates.length-1):0;

  const pts=dates.map((date,i)=>{
    const p=state.history[date]||0;
    return {x:padL+i*stepX, y:padTop+plotH*(1-p/100), p, date};
  });

  const path=pts.map((pt,i)=>(i===0?"M":"L")+pt.x.toFixed(1)+","+pt.y.toFixed(1)).join(" ");

  const grid=[0,50,100].map(v=>{
    const y=padTop+plotH*(1-v/100);
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
            <text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--muted)">${v}</text>`;
  }).join("");

  const labelEvery=Math.max(1,Math.ceil(dates.length/6));
  const labels=pts.map((pt,i)=>{
    if(i%labelEvery!==0 && i!==pts.length-1) return "";
    const lbl=new Date(pt.date+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
    return `<text x="${pt.x}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(lbl)}</text>`;
  }).join("");

  const r=dates.length>25?2:3;
  const dots=pts.map(pt=>`<circle cx="${pt.x}" cy="${pt.y}" r="${r}" fill="${colorFor(pt.p)}"><title>${pt.date}: ${pt.p}%</title></circle>`).join("");

  box.innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="Overall percent complete, ${dates.length} days">
    ${grid}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

function renderTodos(){
  const box=document.getElementById("todoList");
  const todos=state.todos||[];
  if(!todos.length){box.innerHTML='<div class="small">Nothing on your list.</div>';return;}
  box.innerHTML="";
  todos.forEach(t=>{
    const row=document.createElement("div");
    row.className="todo-row"+(t.done?" done":"");
    row.innerHTML=`<label><input type="checkbox" ${t.done?"checked":""}><span>${esc(t.text)}</span></label><button class="todo-del">✕</button>`;
    row.querySelector("input").onchange=(e)=>{
      t.done=e.target.checked;
      saveLocal();renderTodos();scheduleCloudSave();
    };
    row.querySelector(".todo-del").onclick=()=>{
      state.todos=state.todos.filter(x=>x.id!==t.id);
      saveLocal();renderTodos();scheduleCloudSave();
    };
    box.appendChild(row);
  });
}
document.getElementById("todoAddBtn").addEventListener("click", ()=>{
  const input=document.getElementById("todoInput");
  const text=input.value.trim();
  if(!text) return;
  state.todos=state.todos||[];
  state.todos.push({id:uid(),text,done:false});
  input.value="";
  saveLocal();renderTodos();scheduleCloudSave();
});
document.getElementById("todoInput").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("todoAddBtn").click(); });

function rotateDay(){
  checkMidnight();
  saveLocal();
  render();
}

/* ---------- cloud sync (JSONBin.io, fixed bin) ---------- */
async function loadState(){
  try{
    const res = await fetch(`${JSONBIN_API}/latest`, {headers:{"X-Master-Key":API_KEY}});
    if(res.ok){
      const json = await res.json();
      const remote = json.record;
      state = (remote && Array.isArray(remote.activities)) ? remote : defaultState();
      migrateState();
      checkMidnight(); saveLocal();
      setSync(true); render();
      return;
    }
  }catch(e){ /* fall through */ }
  loadLocal();
  setSync(false); render();
}

async function pushToCloud(){
  try{
    const res = await fetch(JSONBIN_API, {
      method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},
      body: JSON.stringify(state)
    });
    setSync(res.ok);
  }catch(e){
    setSync(false);
  }
}
function scheduleCloudSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToCloud, 500);
}
function setSync(ok){
  cloudOk = ok;
  document.getElementById("syncDot").className = "dot " + (ok?"good":"bad");
  document.getElementById("syncText").textContent = ok ? "cloud sync active" : "local only — not synced";
}
document.getElementById("syncBtn").addEventListener("click", async ()=>{
  document.getElementById("syncText").textContent = "syncing…";
  await pushToCloud();
  renderSettings();
});

/* ---------- Settings ---------- */
const overlay=document.getElementById("overlay");
document.getElementById("settingsBtn").onclick=()=>{renderSettings();overlay.classList.add("show")};
document.getElementById("closeSettings").onclick=()=>overlay.classList.remove("show");
overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.classList.remove("show")});

function renderSettings(){
  document.getElementById("settingsSyncInfo").textContent = cloudOk
    ? "Synced to shared cloud save."
    : "Local only — cloud unreachable, retrying.";

  const box=document.getElementById("settingsActivities");
  box.innerHTML="";
  activeActivities().forEach(a=>{
    const row=document.createElement("div");row.className="activity-setting";
    row.innerHTML=`<div class="info"><strong>${esc(a.name)}</strong><span>${formatM(a.target)} goal${a.locked?" · locked, can't be deleted":""}</span></div>${a.locked?"":'<button class="delete">delete</button>'}`;
    if(!a.locked){
      row.querySelector(".delete").onclick=()=>{
        if(confirm(`Stop tracking "${a.name}"? Its past progress stays in your history.`)){
          a.archived=true;
          saveLocal();render();renderSettings();scheduleCloudSave();
        }
      };
    }
    box.appendChild(row);
  });

  const pendBox=document.getElementById("pendingList");
  const pending=state.pending||[];
  if(!pending.length){
    pendBox.innerHTML='<div class="small">Nothing queued.</div>';
  } else {
    pendBox.innerHTML="";
    pending.forEach(item=>{
      const row=document.createElement("div");row.className="activity-setting";
      row.innerHTML=`<div class="info"><strong>${esc(item.name)}</strong><span>${formatM(item.target)} goal — starts tomorrow</span></div><button class="delete">cancel</button>`;
      row.querySelector(".delete").onclick=()=>{
        state.pending=state.pending.filter(x=>x.id!==item.id);
        saveLocal();renderSettings();scheduleCloudSave();
      };
      pendBox.appendChild(row);
    });
  }
}
document.getElementById("addActivity").onclick=()=>{
  const name=document.getElementById("newName").value.trim();
  const target=Number(document.getElementById("newTarget").value);
  if(!name||!target||target<1){alert("Enter an activity name and a target in minutes.");return}
  state.activities.push({id:uid(),name,target,progress:0,archived:false,locked:false});
  saveLocal();render();
  document.getElementById("newName").value="";document.getElementById("newTarget").value="";
  renderSettings();scheduleCloudSave();
};
document.getElementById("addPending").onclick=()=>{
  const name=document.getElementById("pendingName").value.trim();
  const target=Number(document.getElementById("pendingTarget").value);
  if(!name||!target||target<1){alert("Enter an activity name and a target in minutes.");return}
  state.pending=state.pending||[];
  state.pending.push({id:uid(),name,target,queuedOn:today()});
  document.getElementById("pendingName").value="";document.getElementById("pendingTarget").value="";
  saveLocal();renderSettings();scheduleCloudSave();
};

/* Keep the same app data across midnight — check on a timer AND the
   moment the tab regains focus (iPad Safari pauses timers in the
   background, so a resumed tab needs its own check). */
function checkDayRollover(){
  const shown=document.getElementById("date").textContent;
  const now=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  if(shown!==now) rotateDay();
}
setInterval(()=>{ if(!document.hidden) checkDayRollover(); },30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkDayRollover(); });

loadState();
</script>
