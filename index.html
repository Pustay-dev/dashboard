<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171714">
<title>Daily Check-In</title>
<style>
:root{
  --bg:#171714;
  --panel:#22221e;
  --panel2:#2a2a25;
  --text:#f0eee6;
  --muted:#a5a39a;
  --line:rgba(240,238,230,.12);
  --accent:#d6c29a;
  --red:#c9574f;
  --yellow:#d5a93e;
  --green:#70a46d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:620px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(70px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
h1,h2,h3,p{margin:0}
h1{font:600 25px Georgia,serif;letter-spacing:-.4px}
.date{font-size:12px;color:var(--muted);margin-top:4px}
.gear{border:1px solid var(--line);background:var(--panel);color:var(--text);width:42px;height:42px;border-radius:12px;font-size:20px}
.sync{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.good{background:var(--green)}
.dot.bad{background:var(--red)}
.sync button{border:0;background:none;color:var(--accent);font-size:11px;padding:0;text-decoration:underline}

.global{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:22px}
.global-top{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}
.global-label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.global-pct{font:600 38px Georgia,serif;line-height:1}
.bar{height:15px;background:var(--bg);border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;border-radius:20px;transition:width .25s ease,background .25s ease}
.global-foot{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:12px}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-head h2{font:600 17px Georgia,serif}
.small{font-size:11px;color:var(--muted)}

.activity{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px}
.activity-head{display:flex;justify-content:space-between;gap:12px}
.name{font-size:16px;font-weight:650}
.target{font-size:12px;color:var(--muted);margin-top:2px}
.pct{font:600 20px Georgia,serif;white-space:nowrap}
.activity .bar{height:10px;margin:13px 0 5px}
.activity-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:12px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.actions button{min-height:42px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;font-weight:650;font-size:13px}
.actions button:active{background:var(--accent);color:var(--bg)}
.actions .minus{color:var(--muted)}

.empty{border:1px dashed var(--line);border-radius:14px;padding:25px;text-align:center;color:var(--muted);font-size:13px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:22px 18px calc(28px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sheet h2{font:600 21px Georgia,serif}
.close{background:none;border:0;color:var(--muted);font-size:26px}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 12px;outline:none}
input:focus{border-color:var(--accent)}
.primary{width:100%;margin-top:15px;background:var(--accent);color:var(--bg);border:0;border-radius:10px;padding:12px;font-weight:700}
.secondary{width:100%;margin-top:8px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:600}
.divider{border-top:1px solid var(--line);margin:22px 0}
.activity-setting{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.activity-setting .info{flex:1}
.activity-setting strong{font-size:13px}
.activity-setting span{display:block;color:var(--muted);font-size:11px}
.delete{background:none;border:0;color:var(--red);font-size:12px}
.notice{font-size:11px;line-height:1.5;color:var(--muted);background:var(--panel2);padding:11px;border-radius:9px;margin-top:12px}
.status-msg{font-size:12px;margin-top:10px;color:var(--muted)}
.history-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.history-row:last-child{border-bottom:0}
.history-row span:last-child{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Daily Check-In</h1>
      <div class="date" id="date"></div>
      <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">local only</span><button id="syncBtn">sync now</button></div>
    </div>
    <button class="gear" id="settingsBtn" aria-label="Settings">⚙︎</button>
  </header>

  <section class="global">
    <div class="global-top">
      <div class="global-label">Today's progress</div>
      <div class="global-pct" id="globalPct">0%</div>
    </div>
    <div class="bar"><div class="fill" id="globalFill"></div></div>
    <div class="global-foot"><span id="globalMinutes">0 / 0 min</span><span id="globalState">Start.</span></div>
  </section>

  <div class="section-head">
    <h2>Activities</h2>
    <span class="small" id="activityCount"></span>
  </div>
  <main id="activities"></main>

  <section class="global" style="margin-top:22px">
    <div class="section-head" style="margin-bottom:6px"><h2>Recent days</h2><span class="small">saved locally + cloud</span></div>
    <div id="history"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head"><h2>Settings</h2><button class="close" id="closeSettings">×</button></div>

    <h3 style="font:600 16px Georgia,serif">Activities</h3>
    <div id="settingsActivities"></div>

    <div class="divider"></div>
    <h3 style="font:600 16px Georgia,serif">Add activity</h3>
    <label for="newName">Activity name</label>
    <input id="newName" placeholder="e.g. Painting">
    <label for="newTarget">Daily requirement (minutes)</label>
    <input id="newTarget" type="number" min="1" step="1" placeholder="120">
    <button class="primary" id="addActivity">Add activity</button>

    <div class="divider"></div>
    <h3 style="font:600 16px Georgia,serif">Cloud sync</h3>
    <div class="small" id="settingsSyncInfo"></div>
    <button class="secondary" id="resetDay" style="margin-top:22px;">Reset today's progress</button>
  </div>
</div>

<script>
/*
  DAILY CHECK-IN
  ----------------
  Local storage is always used first as a cache.
  Cloud sync below points at one fixed JSONBin.io bin, shared by every
  device that loads this file — no per-device setup, no sync links.

  NOTE: the key below is a JSONBin key embedded in this file, so it's
  visible to anyone who views source. Fine for a private, personal-use
  bin — don't use this pattern for anything you don't want writable by
  whoever gets a copy of this HTML.
*/
const BIN_ID = "6a9b3c7dda38895dfe3a22ef";
const API_KEY = "$2a$10$hlqfMzR5Oh/4/9sT94qsn.9nKQ.nyIYDwhpAXEDkOuFVmjKz.JDtm";
const JSONBIN_API = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const LOCAL = "daily_checkin_v1";

let state = null;
let cloudOk = false;
let saveTimer = null;

function today(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function defaultState(){
  return {
    activities:[
      {id:uid(),name:"Painting",target:120},
      {id:uid(),name:"Workout",target:60},
      {id:uid(),name:"Reading",target:45}
    ],
    days:{}
  };
}
function ensureDay(){
  const d=today();
  if(!state.days[d]) state.days[d]={};
  state.activities.forEach(a=>{
    if(typeof state.days[d][a.id]!=="number") state.days[d][a.id]=0;
  });
}
function saveLocal(){
  localStorage.setItem(LOCAL,JSON.stringify(state));
}
function loadLocal(){
  try{ state=JSON.parse(localStorage.getItem(LOCAL)||"null"); }catch(e){state=null}
  if(!state || !Array.isArray(state.activities) || !state.days) state=defaultState();
  ensureDay(); saveLocal();
}
function mins(){
  const day=state.days[today()]||{};
  return state.activities.reduce((sum,a)=>sum+(Number(day[a.id])||0),0);
}
function targetTotal(){
  return state.activities.reduce((sum,a)=>sum+Number(a.target||0),0);
}
function pctFor(a){
  const v=Number(state.days[today()][a.id])||0;
  return Math.max(0,Math.min(100,(v/Number(a.target||1))*100));
}
function globalPct(){
  const t=targetTotal();
  return t?Math.max(0,Math.min(100,(mins()/t)*100)):0;
}
function colorFor(p){
  if(p<10) return "var(--red)";
  if(p<90) return "var(--yellow)";
  return "var(--green)";
}
function formatM(m){
  m=Math.round(m);
  if(m>=60){
    const h=Math.floor(m/60), r=m%60;
    return r ? h+"h "+r+"m" : h+"h";
  }
  return m+"m";
}

function render(){
  ensureDay();
  const d=new Date();
  document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const gp=globalPct();
  const gf=document.getElementById("globalFill");
  gf.style.width=gp+"%"; gf.style.background=colorFor(gp);
  document.getElementById("globalPct").textContent=Math.round(gp)+"%";
  document.getElementById("globalPct").style.color=colorFor(gp);
  document.getElementById("globalMinutes").textContent=formatM(mins())+" / "+formatM(targetTotal());
  document.getElementById("globalState").textContent=gp<10?"Start.":gp<90?"Keep going.":gp<100?"Almost there.":"Complete.";
  document.getElementById("activityCount").textContent=state.activities.length+" activities";

  const root=document.getElementById("activities");
  root.innerHTML="";
  if(!state.activities.length){
    root.innerHTML='<div class="empty">No activities yet.<br>Open ⚙︎ to add your first one.</div>';
  }
  state.activities.forEach(a=>{
    const p=pctFor(a), value=Number(state.days[today()][a.id])||0;
    const el=document.createElement("article");
    el.className="activity";
    el.innerHTML=`
      <div class="activity-head">
        <div><div class="name">${esc(a.name)}</div><div class="target">${formatM(a.target)} required today</div></div>
        <div class="pct" style="color:${colorFor(p)}">${Math.round(p)}%</div>
      </div>
      <div class="bar"><div class="fill" style="width:${p}%;background:${colorFor(p)}"></div></div>
      <div class="activity-foot"><span>${formatM(value)} completed</span><span>${Math.max(0,Math.ceil(a.target-value))>0?formatM(Math.max(0,a.target-value))+" left":"done"}</span></div>
      <div class="actions">
        <button class="minus" data-d="-15">−15m</button>
        <button data-d="15">+15m</button>
        <button data-d="30">+30m</button>
        <button data-d="60">+1h</button>
      </div>`;
    el.querySelectorAll("button").forEach(b=>b.onclick=()=>adjust(a.id,Number(b.dataset.d)));
    root.appendChild(el);
  });
  renderHistory();
}
function adjust(id,delta){
  ensureDay();
  state.days[today()][id]=Math.max(0,(Number(state.days[today()][id])||0)+delta);
  saveLocal(); render(); scheduleCloudSave();
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function renderHistory(){
  const box=document.getElementById("history");
  const dates=Object.keys(state.days).filter(d=>d!==today()).sort().reverse().slice(0,7);
  if(!dates.length){box.innerHTML='<div class="small">Your previous days will appear here.</div>';return;}
  box.innerHTML="";
  dates.forEach(date=>{
    const vals=state.activities.reduce((s,a)=>s+(Number(state.days[date]?.[a.id])||0),0);
    const p=targetTotal()?Math.min(100,vals/targetTotal()*100):0;
    const row=document.createElement("div");
    row.className="history-row";
    row.innerHTML=`<span>${new Date(date+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</span><span>${Math.round(p)}% · ${formatM(vals)}</span>`;
    box.appendChild(row);
  });
}

function rotateDay(){
  ensureDay();
  saveLocal();
  render();
}

/* ---------- cloud sync (JSONBin.io, fixed bin) ---------- */
async function loadState(){
  try{
    const res = await fetch(`${JSONBIN_API}/latest`, {headers:{"X-Master-Key":API_KEY}});
    if(res.ok){
      const json = await res.json();
      const remote = json.record;
      state = (remote && Array.isArray(remote.activities) && remote.days) ? remote : defaultState();
      ensureDay(); saveLocal();
      setSync(true); render();
      return;
    }
  }catch(e){ /* fall through */ }
  // cloud unreachable — fall back to local cache/default
  loadLocal();
  setSync(false); render();
}

async function pushToCloud(){
  try{
    const res = await fetch(JSONBIN_API, {
      method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},
      body: JSON.stringify(state)
    });
    setSync(res.ok);
  }catch(e){
    setSync(false);
  }
}
function scheduleCloudSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToCloud, 500);
}
function setSync(ok){
  cloudOk = ok;
  document.getElementById("syncDot").className = "dot " + (ok?"good":"bad");
  document.getElementById("syncText").textContent = ok ? "cloud sync active" : "local only — not synced";
}
document.getElementById("syncBtn").addEventListener("click", async ()=>{
  document.getElementById("syncText").textContent = "syncing…";
  await pushToCloud();
  renderSettings();
});

/* ---------- Settings ---------- */
const overlay=document.getElementById("overlay");
document.getElementById("settingsBtn").onclick=()=>{renderSettings();overlay.classList.add("show")};
document.getElementById("closeSettings").onclick=()=>overlay.classList.remove("show");
overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.classList.remove("show")});

function renderSettings(){
  document.getElementById("settingsSyncInfo").textContent = cloudOk
    ? "Synced to shared cloud save."
    : "Local only — cloud unreachable, retrying.";
  const box=document.getElementById("settingsActivities");
  box.innerHTML="";
  state.activities.forEach(a=>{
    const row=document.createElement("div");row.className="activity-setting";
    row.innerHTML=`<div class="info"><strong>${esc(a.name)}</strong><span>${formatM(a.target)} / day</span></div><button class="delete">delete</button>`;
    row.querySelector(".delete").onclick=()=>{
      if(confirm(`Delete "${a.name}"? Existing history for it will remain in the data.`)){
        state.activities=state.activities.filter(x=>x.id!==a.id);
        saveLocal();render();renderSettings();scheduleCloudSave();
      }
    };
    box.appendChild(row);
  });
}
document.getElementById("addActivity").onclick=()=>{
  const name=document.getElementById("newName").value.trim();
  const target=Number(document.getElementById("newTarget").value);
  if(!name||!target||target<1){alert("Enter an activity name and a daily requirement in minutes.");return}
  state.activities.push({id:uid(),name,target});
  ensureDay();saveLocal();render();
  document.getElementById("newName").value="";document.getElementById("newTarget").value="";
  renderSettings();scheduleCloudSave();
};
document.getElementById("resetDay").onclick=()=>{
  if(!confirm("Reset every activity to 0 for today?"))return;
  state.days[today()]={};ensureDay();saveLocal();render();scheduleCloudSave();
};

/* Keep the same app data across midnight. */
setInterval(()=>{ if(document.hidden) return; const shown=document.getElementById("date").textContent; const now=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); if(shown!==now)rotateDay(); },30000);

loadState();
</script>
</body>
</html>
